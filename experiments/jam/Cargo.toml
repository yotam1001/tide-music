[package]
name = "tide-jam-lab"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Deliberately isolated: normal Tide builds do not compile or run the lab.
[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json", "http1", "tokio"] }
getrandom = "=0.3.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tide-core = { path = "../../crates/core" }
tide-playback = { path = "../../crates/playback" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
ureq = { version = "=3.4.2", default-features = false }
url = "2"
zeroize = "1"
