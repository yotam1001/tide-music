# Standalone Linux template. Replace the documentation domain and certificate
# paths. Validate nginx -t and the private relay guide before any remote trial.
worker_processes 1;
error_log /dev/null;
events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    client_header_timeout 3s;
    client_body_timeout 2s;
    send_timeout 3s;
    keepalive_timeout 0;
    reset_timedout_connection on;

    limit_req_zone $binary_remote_addr zone=jam_rate:1m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=jam_peers:1m;
    map $server_name $jam_global { default jam; }
    limit_conn_zone $jam_global zone=jam_total:1m;

    # No plaintext redirect: clients must explicitly choose HTTPS.
    server { listen 80 default_server; return 444; }
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen 443 ssl;
        server_name jam.example.test;
        ssl_certificate /etc/tide-jam/fullchain.pem;
        ssl_certificate_key /etc/tide-jam/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        if ($http_host != "jam.example.test") { return 444; }

        limit_req zone=jam_rate burst=15 nodelay;
        limit_req_status 429;
        limit_conn jam_peers 8;
        limit_conn jam_total 16;
        limit_conn_status 429;
        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection close;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
            proxy_redirect off;
        }
    }
}
