[package]
name = "tide-music"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
tide-core = { path = "../core" }
tide-playback = { path = "../playback" }
tide-windows = { path = "../windows" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-path", "compat-1-2", "raw-window-handle-06"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "=1.18.1"
