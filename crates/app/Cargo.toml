[package]
name = "tide-music"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

# Generated bindings have no standalone tests. The existing player unit tests
# and native integration tests validate them without a second empty harness.
[lib]
test = false
doctest = false

[features]
default = ["jams"]
jams = ["experimental-jams"]
experimental-jams = ["dep:tide-jam-lab", "dep:zeroize", "dep:arboard"]

[dependencies]
arboard = { version = "3", default-features = false, optional = true }
tide-core = { path = "../core" }
tide-playback = { path = "../playback" }
tide-windows = { path = "../windows" }
tide-provider = { path = "../provider" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-path", "compat-1-2", "raw-window-handle-06"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
tide-jam-lab = { path = "../../experiments/jam", default-features = false, optional = true }
zeroize = { version = "1", optional = true }
semver = "1"
sha2 = "0.10"
ring = "=0.17.14"
tempfile = "3"


[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1.31"
