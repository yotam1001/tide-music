[package]
name = "grove-music"
version = "0.1.0-beta.1"
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-path", "compat-1-2", "raw-window-handle-06"] }
serde_json = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots", "rodio-backend"] }
librespot-connect = { version = "=0.8.0", default-features = false }
librespot-metadata = { version = "=0.8.0", default-features = false }
librespot-protocol = { version = "=0.8.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
zeroize = "1"
tide-windows = { path = "../windows" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "0.6"
tide-core = { path = "../core" }
tide-jam = { path = "../jam" }
tide-playback = { path = "../playback" }
rfd = "0.17.2"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1.31"
resvg = { version = "0.48.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
# librespot-core 0.8 and vergen-gitcl 1.0 require vergen's pre-9.1 trait layout.
vergen = { version = "=9.0.6", default-features = false }
