[package]
name = "tide-playback"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
tide-core = { path = "../core" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
