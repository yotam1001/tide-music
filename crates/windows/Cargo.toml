[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
