[package]
name = "tide-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
native-login = ["dep:webview2-com", "dep:url", "dep:zeroize", "dep:serde_json"]

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "=0.39.1", optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
zeroize = { version = "1", optional = true }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_IO", "Win32_System_Registry", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Media_Control"] }
