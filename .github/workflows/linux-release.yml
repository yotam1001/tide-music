name: Linux release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build and attach assets to
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    name: AppImage (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: |
          sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libdbus-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev squashfs-tools xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-appimage
          cache-on-failure: true
      - run: python3 scripts/test_package_linux.py
      - name: Build, verify and package stable Tide
        run: |
          xvfb-run -a scripts/package-linux.sh
          # xvfb-run can mask a failing exit status; require the output too.
          test -s dist/Tide-x86_64.AppImage
      - name: Hash release assets
        working-directory: dist
        run: |
          for image in *.AppImage; do sha256sum "$image" > "$image.sha256"; done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_attach_macos_assets.py'
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-x86_64
          path: dist
      # Uploads only to a draft. A rerun against a published release verifies
      # its assets and leaves them alone, so SHA256SUMS.txt stays valid.
      - name: Attach AppImages and checksums
        run: python3 scripts/attach_macos_assets.py "$RELEASE_TAG" dist
      # Never import the update signing key into CI. The maintainer signs
      # TideUpdate-linux.json locally per docs/RELEASE_SIGNING.md.
