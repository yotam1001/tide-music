name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fast-checks:
    name: Scripts, privacy and browser checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install cryptography==50.0.0
      - run: python scripts/check_public_files.py
      - run: python -m unittest discover -s helpers -p "test_*.py"
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: node --test browser-companion/tests/background.test.cjs
  checks:
    name: Rust and native Jam checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      # Stable defaults already enable Jams. Check the full workspace and its
      # native UI once, then reuse these compiled outputs for isolation probes.
      - run: cargo test --workspace --locked --features tide-music/experimental-jams
        env:
          TIDE_UI_REVIEW_DIR: .local/ui-review
          TIDE_JAM_LAYOUT_DIR: ${{ github.workspace }}/.local/jam-ui-layouts
          TIDE_PLAYER_INDICATORS_DIR: ${{ github.workspace }}/.local/player-indicators
      - name: Save synthetic native UI review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tide-ui-review-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            crates/app/.local/ui-review/*.png
            .local/jam-ui-layouts/*.png
            .local/player-indicators/*.png
          if-no-files-found: ignore
          retention-days: 7
      - run: cargo clippy --workspace --all-targets --locked --features tide-music/experimental-jams -- -D warnings
      - name: Reject private pipe input without blocking guest cancellation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local | Out-Null
          cargo test -p tide-music --locked --features experimental-jams --bin tide-music --no-run --message-format=json | Set-Content .local/jam-pipe-build.jsonl -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Private file probe build failed' }
          python experiments/jam/check-private-pipe.py --cargo-artifacts .local/jam-pipe-build.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Private file cancellation probe failed' }
      - name: Verify optional transport isolation and callback ownership without a desktop window
        shell: pwsh
        run: |
          $taskDefaultTree = cargo tree -p tide-music --no-default-features --locked --edges normal --prefix none
          if ($LASTEXITCODE -ne 0) { throw 'Default dependency tree failed' }
          if ($taskDefaultTree | Select-String '^tide-jam-lab v') { throw 'Opt-out build links the Jam transport' }
          $taskJamTree = cargo tree -p tide-music --locked --features experimental-jams --edges normal --prefix none
          if ($LASTEXITCODE -ne 0) { throw 'Experimental dependency tree failed' }
          if ($taskJamTree | Select-String '^axum v') { throw 'Player links the relay server' }
          $taskStableTree = cargo tree -p tide-music --locked --edges normal --prefix none
          if ($LASTEXITCODE -ne 0) { throw 'Stable dependency tree failed' }
          if (!($taskStableTree | Select-String '^tide-jam-lab v')) { throw 'Stable player is missing Jams' }
          if ($taskStableTree | Select-String '^axum v') { throw 'Stable player links the relay server' }
          ./experiments/jam/prepare-native.ps1
          $env:TIDE_RUNTIME_DIR = (Join-Path $PWD '.local/jam-native-runtime')
          cargo run -p tide-music --locked --features experimental-jams -- --smoke-jam-ownership
          if ($LASTEXITCODE -ne 0) { throw 'Guest ownership verification failed' }
  preview:
    # Packaging is isolated and may build while tests/lint run. Publication is
    # gated on every job by release-ready below.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build preview with remapped development paths
        shell: pwsh
        run: ./scripts/build-preview.ps1 -StaticMsvcRuntime -IncludeBrowserHost
      - name: Generate dependency notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local | Out-Null
          cargo metadata --locked --filter-platform x86_64-pc-windows-msvc --format-version 1 | Set-Content .local/windows-metadata.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          python scripts/generate-dependency-notices.py .local/windows-metadata.json .local/DEPENDENCIES.md
          if ($LASTEXITCODE -ne 0) { throw 'Dependency notices failed' }
      - name: Package and verify preview
        shell: pwsh
        run: |
          ./scripts/package-preview.ps1 -Executable target/x86_64-pc-windows-msvc/release/tide-music.exe -BrowserHostExecutable target/x86_64-pc-windows-msvc/release/tide-session-host.exe -DependenciesNotice .local/DEPENDENCIES.md -StartHere docs/START_HERE.md -Destination dist/tide-windows-preview
          python scripts/check-preview-package.py dist/tide-windows-preview.zip --with-browser-host
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed' }
          ./scripts/build-installer.ps1 -Package dist/tide-windows-preview.zip -Destination dist/TideSetup.exe
          python scripts/package-browser-companion.py --family firefox
          if ($LASTEXITCODE -ne 0) { throw 'Firefox companion packaging failed' }
          python scripts/package-browser-companion.py --family chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium companion packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: tide-windows-preview-${{ github.sha }}
          overwrite: true
          path: |
            dist/TideSetup.exe
            dist/tide-windows-preview.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: tide-browser-companion-prototypes-${{ github.sha }}
          overwrite: true
          path: |
            dist/tide-browser-firefox/
            dist/tide-browser-chromium/
          if-no-files-found: error
          retention-days: 14
  installed-preview:
    name: Real Windows install/update/remove
    needs: preview
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tide-windows-preview-${{ github.sha }}
          path: .local/clean-installer-artifact
      - name: Verify actual setup and unpack matching preview
        shell: pwsh
        run: |
          python scripts/check-preview-package.py .local/clean-installer-artifact/tide-windows-preview.zip --with-browser-host
          if ($LASTEXITCODE -ne 0) { throw 'Preview verification failed' }
          $setup = Start-Process -FilePath (Join-Path $PWD '.local/clean-installer-artifact/TideSetup.exe') -ArgumentList '--verify-payload' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Actual setup embedded-payload verification failed' }
          Expand-Archive -LiteralPath .local/clean-installer-artifact/tide-windows-preview.zip -DestinationPath .local/clean-payload
      - name: Exercise real per-user install, Chrome host, update and removal
        id: clean-install
        shell: pwsh
        run: ./scripts/verify-clean-windows.ps1 -PackageRoot .local/clean-payload -SetupExecutable .local/clean-installer-artifact/TideSetup.exe
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.clean-install.outputs.evidence-directory != '' }}
        with:
          name: tide-clean-windows-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.clean-install.outputs.evidence-directory }}
          if-no-files-found: error
          retention-days: 7
  release-ready:
    name: Release validation
    if: ${{ always() }}
    needs: [fast-checks, checks, installed-preview]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validations
        env:
          FAST_RESULT: ${{ needs.fast-checks.result }}
          RUST_RESULT: ${{ needs.checks.result }}
          INSTALL_RESULT: ${{ needs.installed-preview.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$RUST_RESULT" = success
          test "$INSTALL_RESULT" = success
