name: WinGet release smoke test
on:
  workflow_dispatch:
  push:
    branches: [codex/tide-winget]
    paths:
      - .github/workflows/winget-smoke.yml
      - scripts/test-winget-release.ps1
      - packaging/winget/**
permissions:
  contents: read
jobs:
  clean-install:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ensure WinGet is available
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $taskBootstrap = Join-Path $env:RUNNER_TEMP 'winget-bootstrap'
          New-Item -ItemType Directory -Path $taskBootstrap | Out-Null
          $taskBase = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380/'
          $taskBundle = Join-Path $taskBootstrap 'AppInstaller.msixbundle'
          $taskDependencies = Join-Path $taskBootstrap 'dependencies.zip'
          Invoke-WebRequest -UseBasicParsing -Uri ($taskBase + 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle') -OutFile $taskBundle -TimeoutSec 120
          Invoke-WebRequest -UseBasicParsing -Uri ($taskBase + 'DesktopAppInstaller_Dependencies.zip') -OutFile $taskDependencies -TimeoutSec 120
          Expand-Archive -LiteralPath $taskDependencies -DestinationPath (Join-Path $taskBootstrap 'dependencies')
          $taskPaths = @(Get-ChildItem (Join-Path $taskBootstrap 'dependencies/x64') -Recurse -File | Where-Object { $_.Extension -in @('.appx', '.msix') } | ForEach-Object FullName)
          Add-AppxPackage -Path $taskBundle -DependencyPath $taskPaths -ForceUpdateFromAnyVersion -ForceApplicationShutdown
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet is unavailable.' }
      - name: Install, inspect, repeat install, and uninstall
        shell: pwsh
        run: ./scripts/test-winget-release.ps1
      - name: Collect WinGet logs
        if: always()
        shell: pwsh
        run: |
          $taskLogs = '.local/winget-smoke'
          New-Item -ItemType Directory -Force $taskLogs | Out-Null
          $taskSource = Join-Path $env:LOCALAPPDATA 'Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir'
          if (Test-Path -LiteralPath $taskSource) {
            Get-ChildItem -LiteralPath $taskSource -File -Filter '*.log' | Copy-Item -Destination $taskLogs
          }
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tide-winget-smoke-logs
          path: |
            .local/winget-smoke/*.txt
            .local/winget-smoke/*.json
            .local/winget-smoke/*.log
          include-hidden-files: true
          if-no-files-found: ignore
