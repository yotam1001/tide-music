name: macOS checks
on:
  push:
    branches: ['mac/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bundle:
    name: bundle (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-bundle-${{ matrix.arch }}
          cache-on-failure: true
      - name: Enable Intel runtime verification
        if: matrix.arch == 'x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: python3 scripts/test_package_macos.py
      - name: Build, sign, verify and package stable Tide
        run: scripts/package-macos.sh --arch '${{ matrix.arch }}'
      - name: Print DMG sizes
        run: stat -f '%N %z bytes' dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Tide-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  rust:
    name: macOS Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-validation
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --lib --bins --locked -- -D warnings
      - run: cargo test --workspace --locked

  playback-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: brew install mpv yt-dlp
      - run: cargo test -p tide-playback --locked
      - run: cargo clippy -p tide-playback --locked -- -D warnings
      - run: cargo test -p tide-playback real_mpv_exits_when_lifetime_connection_closes -- --ignored
      - run: cargo test -p tide-playback native_audio_preferences_probe -- --ignored
      - run: cargo test -p tide-playback native_recovery_fault_probe -- --ignored
