name: macOS checks
on:
  push:
    branches: ['mac/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bundle:
    name: bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The Intel bundle takes ~35 minutes on PRs. macos-release.yml still
        # builds and verifies both DMGs from the tag before anything ships.
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"arch":"arm64","runner":"macos-latest"}]'
          || '[{"arch":"arm64","runner":"macos-latest"},{"arch":"x86_64","runner":"macos-15-intel"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-bundle-${{ matrix.arch }}
          cache-on-failure: true
      - run: python3 scripts/test_package_macos.py
      - name: Build, sign, verify and package stable Tide
        run: scripts/package-macos.sh --arch '${{ matrix.arch }}'
      - name: Print DMG sizes
        run: stat -f '%N %z bytes' dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Tide-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  published-dmg:
    name: Audit currently published Mac downloads
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assess the website's GitHub downloads
        run: |
          for asset in Tide.dmg Tide-Intel.dmg; do
            url="https://github.com/yotam1001/tide-music/releases/latest/download/$asset"
            echo "Published asset: $url"
            curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
              --output "$RUNNER_TEMP/$asset" "$url"
            shasum -a 256 "$RUNNER_TEMP/$asset"
            # Collect evidence even when a previously shipped image fails.
            python3 scripts/check_macos_dmg.py "$RUNNER_TEMP/$asset" || \
              echo "::warning::Published $asset failed the signature audit"
          done

  developer-build:
    name: macOS developer build with Homebrew runtimes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-developer-build
      - run: brew install mpv yt-dlp deno
      - run: cargo build --release --locked -p tide-music
      - run: cargo build --release --locked -p tide-provider --bin tide-login --features tide-provider/native-login
      - run: cargo build --release --locked -p tide-provider --bin tide-session-host
      - run: target/release/tide-login --probe
      - run: cargo test -p tide-playback --locked real_mpv_exits_when_lifetime_connection_closes -- --ignored
      - run: cargo test -p tide-playback --locked native_recovery_fault_probe -- --ignored

  rust:
    name: macOS Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-validation
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --lib --bins --locked -- -D warnings
      - run: cargo check -p tide-provider --features native-login --bins
      - run: cargo clippy -p tide-provider -p tide-macos --features tide-provider/native-login,tide-macos/native-login --lib --bins -- -D warnings
      - run: cargo run -p tide-provider --features native-login --bin tide-login -- --probe
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo test -p tide-macos --features native-login --locked
      - run: python3 -m unittest discover -s scripts -p 'test_setup_browser_companion_macos.py'
      - run: python3 -m unittest discover -s scripts -p 'test_browser_companion_package.py'
      - run: python3 -m unittest discover -s helpers -p 'test_youtube_music.py'

  playback-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: brew install yt-dlp
      # Probe the exact mpv that Tide.app ships (runtime.lock.json), not
      # whatever Homebrew carries that day: Homebrew's mpv 0.42 rejects a
      # filter configuration that the bundled 0.41 accepts.
      - name: Install the pinned bundled mpv
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile, urllib.request, zipfile
          entry = json.load(open('packaging/macos/runtime.lock.json'))['mpv']['arm64']
          work = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pinned-mpv'
          work.mkdir(parents=True, exist_ok=True)
          archive = work / 'mpv.archive'
          urllib.request.urlretrieve(entry['url'], archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == entry['sha256'], 'mpv checksum mismatch'
          if entry['format'] == 'zip-tar':
              archive.write_bytes(zipfile.ZipFile(archive).read('mpv.tar.gz'))
          tarfile.open(archive).extractall(work, filter='data')
          PY
          mkdir -p "$RUNNER_TEMP/runtime"
          ln -sf "$RUNNER_TEMP/pinned-mpv/mpv.app/Contents/MacOS/mpv" "$RUNNER_TEMP/runtime/mpv"
          ln -sf "$(command -v yt-dlp)" "$RUNNER_TEMP/runtime/yt-dlp"
          echo "TIDE_RUNTIME_DIR=$RUNNER_TEMP/runtime" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/runtime/mpv" --version | head -1
      - run: cargo test -p tide-playback --locked
      - run: cargo clippy -p tide-playback --locked -- -D warnings
      - run: cargo test -p tide-playback real_mpv_exits_when_lifetime_connection_closes -- --ignored
      - run: cargo test -p tide-playback native_audio_preferences_probe -- --ignored
      - run: cargo test -p tide-playback native_recovery_fault_probe -- --ignored
      - name: Validate Jam protocol on macOS
        run: cargo test --manifest-path experiments/jam/Cargo.toml --locked --test protocol_sync --test network --test invite_codes
      - name: Synchronize two native mpv workers with a muted fixture
        run: |
          export JAM_NATIVE_FIXTURE="$RUNNER_TEMP/jam-silence.wav"
          python3 - <<'PY'
          import os, wave
          with wave.open(os.environ['JAM_NATIVE_FIXTURE'], 'wb') as audio:
              audio.setparams((1, 2, 48000, 0, 'NONE', 'not compressed'))
              for _ in range(90):
                  audio.writeframes(b'\0' * 96000)
          PY
          cargo test --manifest-path experiments/jam/Cargo.toml --locked --features headless-native --test native -- --ignored --nocapture --test-threads=1
