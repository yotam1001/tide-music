name: macOS release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build and attach assets to
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    name: bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-bundle-${{ matrix.arch }}
          cache-on-failure: true
      - run: python3 scripts/test_package_macos.py
      - name: Build, sign, verify and package stable Tide
        run: scripts/package-macos.sh --arch '${{ matrix.arch }}'
      - name: Hash release assets
        working-directory: dist
        run: |
          for dmg in *.dmg; do shasum -a 256 "$dmg" > "$dmg.sha256"; done
          stat -f '%N %z bytes' *.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_attach_macos_assets.py'
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-release-*
          merge-multiple: true
          path: dist
      # Uploads only to a draft. A rerun against a published release verifies
      # its assets and leaves them alone, so SHA256SUMS.txt stays valid.
      - name: Attach DMGs and checksums
        run: python3 scripts/attach_macos_assets.py "$RELEASE_TAG" dist
      # Never import the update signing key into CI. The maintainer downloads
      # these artifacts and signs update manifests locally per docs/RELEASE_SIGNING.md,
      # then uploads the signed manifests manually.
