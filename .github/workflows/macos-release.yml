name: Intel Mac preview validation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-native-intel-preview
      - run: test "$(uname -m)" = x86_64
      - run: python3 scripts/test_package_macos.py
      - run: scripts/package-macos.sh --arch x86_64
      - name: Test Jams with the mounted Intel bundle's mpv
        run: |
          mount_dir="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" dist/Tide-Intel.dmg
          trap 'hdiutil detach "$mount_dir"' EXIT
          export TIDE_RUNTIME_DIR="$mount_dir/Tide.app/Contents/Resources/bin"
          export JAM_NATIVE_FIXTURE="$RUNNER_TEMP/jam-silence.wav"
          python3 - <<'PY'
          import os, wave
          with wave.open(os.environ['JAM_NATIVE_FIXTURE'], 'wb') as audio:
              audio.setparams((1, 2, 48000, 0, 'NONE', 'not compressed'))
              for _ in range(90):
                  audio.writeframes(b'\0' * 96000)
          PY
          cargo test --manifest-path experiments/jam/Cargo.toml --locked --features headless-native --test native -- --ignored --nocapture --test-threads=1
      - uses: actions/upload-artifact@v4
        with:
          name: Tide-macos-native-intel
          path: dist/*.dmg
          if-no-files-found: error
