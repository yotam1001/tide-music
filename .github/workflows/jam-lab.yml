name: Jam feasibility lab
on:
  push:
    paths:
      - 'experiments/jam/**'
      - 'crates/core/**'
      - 'crates/playback/**'
      - '.github/workflows/jam-lab.yml'
  pull_request:
    paths:
      - 'experiments/jam/**'
      - 'crates/core/**'
      - 'crates/playback/**'
      - '.github/workflows/jam-lab.yml'
permissions:
  contents: read
jobs:
  jam-lab:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/jam -> target
      - run: cargo fmt --manifest-path experiments/jam/Cargo.toml --all -- --check
      - run: cargo test --manifest-path experiments/jam/Cargo.toml --locked
      - run: cargo clippy --manifest-path experiments/jam/Cargo.toml --all-targets --locked -- -D warnings
      - name: Prepare trusted runtimes and silent fixture
        shell: pwsh
        run: |
          ./experiments/jam/prepare-native.ps1
          New-Item -ItemType Directory -Force .local | Out-Null
          @'
          import wave
          with wave.open('.local/jam-silence.wav', 'wb') as output:
              output.setnchannels(1)
              output.setsampwidth(2)
              output.setframerate(48000)
              for _ in range(90):
                  output.writeframes(b'\0' * 96000)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Silent fixture preparation failed' }
      - name: Two muted native players and real loopback relay
        shell: pwsh
        run: |
          $env:TIDE_RUNTIME_DIR = (Join-Path $PWD '.local/jam-native-runtime')
          $env:JAM_NATIVE_FIXTURE = (Join-Path $PWD '.local/jam-silence.wav')
          cargo test --manifest-path experiments/jam/Cargo.toml --locked --test native -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native Jam validation failed' }
      - name: Diagnose fixture output on failed native runner
        if: failure()
        shell: pwsh
        run: |
          $taskMpv = Join-Path $PWD '.local/jam-native-runtime/mpv.exe'
          $taskWave = Join-Path $PWD '.local/jam-silence.wav'
          if ((Test-Path -LiteralPath $taskMpv) -and (Test-Path -LiteralPath $taskWave)) {
            foreach ($taskSink in @('wasapi', 'null')) {
              $taskOut = Join-Path $PWD ('.local/mpv-' + $taskSink + '.stdout.log')
              $taskErr = Join-Path $PWD ('.local/mpv-' + $taskSink + '.stderr.log')
              $taskArgs = @('--no-config', '--no-video', ('--ao=' + $taskSink), '--length=0.25', '--volume=0', '--', ('"' + $taskWave + '"'))
              $taskProbe = Start-Process -FilePath $taskMpv -ArgumentList $taskArgs -WindowStyle Hidden -PassThru -RedirectStandardOutput $taskOut -RedirectStandardError $taskErr
              if (!$taskProbe.WaitForExit(10000)) { $taskProbe.Kill(); $taskProbe.WaitForExit() }
              Write-Output ('Synthetic fixture sink ' + $taskSink + ' exit ' + $taskProbe.ExitCode)
              Get-Content -LiteralPath $taskOut,$taskErr -TotalCount 20
            }
          }
