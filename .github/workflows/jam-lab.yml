name: Jam feasibility lab
on:
  push:
    paths:
      - 'experiments/jam/**'
      - 'crates/core/**'
      - 'crates/playback/**'
      - 'crates/app/**'
      - 'ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/jam-lab.yml'
  pull_request:
    paths:
      - 'experiments/jam/**'
      - 'crates/core/**'
      - 'crates/playback/**'
      - 'crates/app/**'
      - 'ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/jam-lab.yml'
permissions:
  contents: read
jobs:
  render-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the free Render relay container
        run: docker build -f experiments/jam/render/Dockerfile -t tide-jam-render .
      - name: Exercise proxy isolation, quotas and process shutdown
        run: |
          docker run -d --name tide-render-test -p 127.0.0.1:18765:10000 -e RENDER_EXTERNAL_HOSTNAME=relay-test.onrender.com tide-jam-render
          python3 experiments/jam/render/check_container.py
      - name: Diagnose disposable container
        if: failure()
        run: docker logs --tail 30 tide-render-test
      - name: Stop disposable container
        if: always()
        run: docker rm -f tide-render-test || true
  shared-relay-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: experiments/jam -> target
      - run: cargo test --manifest-path experiments/jam/Cargo.toml --locked --no-default-features --features relay
      - run: cargo clippy --manifest-path experiments/jam/Cargo.toml --locked --no-default-features --features relay --all-targets -- -D warnings
      - run: cargo build --manifest-path experiments/jam/Cargo.toml --locked --no-default-features --features relay --release --bin tide-jam-relay
      - run: experiments/jam/target/release/tide-jam-relay --help
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-jam-relay-linux-${{ github.sha }}
          path: experiments/jam/target/release/tide-jam-relay
          retention-days: 7
  jam-native-controls:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check opt-in native controls and in-memory rendering
        shell: pwsh
        run: |
          $env:TIDE_JAM_LAYOUT_DIR = (Join-Path $PWD '.local/jam-ui-layouts')
          $env:TIDE_PLAYER_INDICATORS_DIR = (Join-Path $PWD '.local/player-indicators')
          cargo test -p tide-music --locked --features experimental-jams
          if ($LASTEXITCODE -ne 0) { throw 'Experimental native app tests failed' }
          cargo clippy -p tide-music --all-targets --locked --features experimental-jams -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Experimental native app Clippy failed' }
      - name: Reject private pipe input without blocking guest cancellation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local | Out-Null
          cargo test -p tide-music --locked --features experimental-jams --bin tide-music --no-run --message-format=json | Set-Content .local/jam-pipe-build.jsonl -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Private file probe build failed' }
          python experiments/jam/check-private-pipe.py --cargo-artifacts .local/jam-pipe-build.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Private file cancellation probe failed' }
      - name: Verify default isolation and callback ownership without a desktop window
        shell: pwsh
        run: |
          $taskDefaultTree = cargo tree -p tide-music --locked --edges normal --prefix none
          if ($LASTEXITCODE -ne 0) { throw 'Default dependency tree failed' }
          if ($taskDefaultTree | Select-String '^tide-jam-lab v') { throw 'Default build links the Jam transport' }
          $taskJamTree = cargo tree -p tide-music --locked --features experimental-jams --edges normal --prefix none
          if ($LASTEXITCODE -ne 0) { throw 'Experimental dependency tree failed' }
          if ($taskJamTree | Select-String '^axum v') { throw 'Experimental player links the relay server' }
          ./experiments/jam/prepare-native.ps1
          $env:TIDE_RUNTIME_DIR = (Join-Path $PWD '.local/jam-native-runtime')
          cargo run -p tide-music --locked --features experimental-jams -- --smoke-jam-ownership
          if ($LASTEXITCODE -ne 0) { throw 'Guest ownership verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-native-ui-${{ github.run_id }}
          path: |
            .local/jam-ui-layouts/*.png
            .local/player-indicators/*.png
          if-no-files-found: ignore
          retention-days: 7
  private-proxy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone nginx template with disposable certificates
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nginx
          mkdir -p "$RUNNER_TEMP/jam-nginx"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=jam.example.test' -keyout "$RUNNER_TEMP/jam-nginx/server.key" -out "$RUNNER_TEMP/jam-nginx/fullchain.pem" 2>/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          fixture = Path(os.environ['RUNNER_TEMP']) / 'jam-nginx'
          for mode in ('private', 'shared'):
              source = Path(f'experiments/jam/nginx-{mode}.example.conf').read_text()
              source = source.replace('/etc/tide-jam/', str(fixture) + '/')
              (fixture / f'nginx-{mode}.conf').write_text(source)
          PY
          sudo nginx -t -c "$RUNNER_TEMP/jam-nginx/nginx-private.conf"
          sudo nginx -t -c "$RUNNER_TEMP/jam-nginx/nginx-shared.conf"
  jam-lab:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: experiments/jam -> target
      - run: cargo fmt --manifest-path experiments/jam/Cargo.toml --all -- --check
      - run: cargo test --manifest-path experiments/jam/Cargo.toml --locked
      - run: cargo clippy --manifest-path experiments/jam/Cargo.toml --all-targets --locked -- -D warnings
      - name: Prepare trusted runtimes and silent fixture
        shell: pwsh
        run: |
          ./experiments/jam/prepare-native.ps1
          New-Item -ItemType Directory -Force .local | Out-Null
          @'
          import wave
          with wave.open('.local/jam-silence.wav', 'wb') as output:
              output.setnchannels(1)
              output.setsampwidth(2)
              output.setframerate(48000)
              for _ in range(90):
                  output.writeframes(b'\0' * 96000)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Silent fixture preparation failed' }
      - name: Two native clocks with explicit headless audio sink
        shell: pwsh
        run: |
          $env:TIDE_RUNTIME_DIR = (Join-Path $PWD '.local/jam-native-runtime')
          $env:JAM_NATIVE_FIXTURE = (Join-Path $PWD '.local/jam-silence.wav')
          cargo test --manifest-path experiments/jam/Cargo.toml --locked --features headless-native --test native -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native Jam validation failed' }
      - name: Diagnose fixture output on failed native runner
        if: failure()
        shell: pwsh
        run: |
          $taskMpv = Join-Path $PWD '.local/jam-native-runtime/mpv.exe'
          $taskWave = Join-Path $PWD '.local/jam-silence.wav'
          if ((Test-Path -LiteralPath $taskMpv) -and (Test-Path -LiteralPath $taskWave)) {
            foreach ($taskSink in @('wasapi', 'null')) {
              $taskOut = Join-Path $PWD ('.local/mpv-' + $taskSink + '.stdout.log')
              $taskErr = Join-Path $PWD ('.local/mpv-' + $taskSink + '.stderr.log')
              $taskArgs = @('--no-config', '--no-video', ('--ao=' + $taskSink), '--length=0.25', '--volume=0', '--', ('"' + $taskWave + '"'))
              $taskProbe = Start-Process -FilePath $taskMpv -ArgumentList $taskArgs -WindowStyle Hidden -PassThru -RedirectStandardOutput $taskOut -RedirectStandardError $taskErr
              if (!$taskProbe.WaitForExit(10000)) { $taskProbe.Kill(); $taskProbe.WaitForExit() }
              Write-Output ('Synthetic fixture sink ' + $taskSink + ' exit ' + $taskProbe.ExitCode)
              Get-Content -LiteralPath $taskOut,$taskErr -TotalCount 20
            }
          }
