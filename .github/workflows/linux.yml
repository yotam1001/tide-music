name: Linux checks
on:
  push:
    branches: ['linux/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  # Build on the oldest supported runner so the AppImage runs on glibc 2.35+.
  LINUX_BUILD_DEPS: >-
    pkg-config libfontconfig1-dev libfreetype-dev libxkbcommon-dev
    libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev
    libxcursor-dev libxrandr-dev libxi-dev libdbus-1-dev
    libgtk-3-dev libwebkit2gtk-4.1-dev squashfs-tools xvfb
jobs:
  rust:
    name: Linux Rust checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-validation
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --lib --bins --locked -- -D warnings
      - run: cargo clippy -p tide-provider -p tide-linux --features tide-provider/native-login,tide-linux/native-login --lib --bins --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
        env:
          RUST_TEST_THREADS: '2'
      - run: cargo test -p tide-linux --features native-login --locked
      - name: Offline native sign-in probe (no Google traffic)
        run: |
          cargo build -p tide-provider --features native-login --bin tide-login --locked
          xvfb-run -a target/debug/tide-login --probe
      - name: Platform integrations on a headless X11 + D-Bus session
        run: |
          cargo build -p tide-music --locked
          xvfb-run -a dbus-run-session -- target/debug/tide-music --smoke-jam-ownership
          # MPRIS driven by a D-Bus client, Mini pin/opacity on a real X
          # window, and global chords pressed through XTEST.
          xvfb-run -a dbus-run-session -- cargo test -p tide-linux --test desktop --locked -- --ignored --test-threads=1
      - name: Session key storage without a keyring (0600 key-file fallback)
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- cargo test -p tide-provider --lib --locked linux_key_store_round_trip -- --ignored --nocapture
      - run: python3 -m unittest discover -s scripts -p 'test_package_linux.py'
      - run: python3 -m unittest discover -s scripts -p 'test_browser_companion_package.py'
      - run: python3 -m unittest discover -s helpers -p 'test_youtube_music.py'

  playback-smoke:
    name: Linux playback smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-playback
      # Probe the exact mpv and yt-dlp the AppImage ships (runtime.lock.json):
      # a newer mpv rejects a filter configuration that 0.41 accepts.
      - name: Install the pinned bundled runtime
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          lock = json.load(open('packaging/linux/runtime.lock.json'))
          work = pathlib.Path(os.environ['RUNNER_TEMP'])
          for key, name in ((lock['mpv']['x86_64'], 'mpv.AppImage'), (lock['yt-dlp'], 'yt-dlp')):
              path = work / name
              urllib.request.urlretrieve(key['url'], path)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == key['sha256'], name
          PY
          cd "$RUNNER_TEMP"
          # DwarFS payload: unpack with the verified image's own runtime, then
          # start bin/mpv directly (never AppRun and its updater hooks).
          chmod +x mpv.AppImage
          ./mpv.AppImage --appimage-extract > /dev/null
          mkdir -p runtime
          printf '#!/bin/sh\nexec "%s/squashfs-root/bin/mpv" "$@"\n' "$RUNNER_TEMP" > runtime/mpv
          chmod +x runtime/mpv yt-dlp && mv yt-dlp runtime/yt-dlp
          echo "TIDE_RUNTIME_DIR=$RUNNER_TEMP/runtime" >> "$GITHUB_ENV"
          runtime/mpv --no-config --version | head -1
      # Hosted runners have no sound server. A desktop always has one; give
      # mpv a PulseAudio null sink so output stays available across reloads.
      - name: Start a headless PulseAudio sink
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1 --daemonize=yes
          pactl load-module module-null-sink sink_name=tide_ci
          pactl set-default-sink tide_ci
          pactl info | grep -E 'Server Name|Default Sink'
      - run: cargo test -p tide-playback --locked
      - run: cargo test -p tide-playback --locked real_mpv_exits_when_lifetime_connection_closes -- --ignored
      - run: cargo test -p tide-playback --locked native_audio_preferences_probe -- --ignored
      - run: cargo test -p tide-playback --locked native_recovery_fault_probe -- --ignored
      - name: Validate Jam protocol on Linux
        run: cargo test --manifest-path experiments/jam/Cargo.toml --locked --test protocol_sync --test network --test invite_codes

  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_BUILD_DEPS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-appimage
          cache-on-failure: true
      - run: python3 scripts/test_package_linux.py
      - name: Build, verify and package stable Tide
        run: |
          xvfb-run -a scripts/package-linux.sh
          # xvfb-run can mask a failing exit status; require the output too.
          test -s dist/Tide-x86_64.AppImage
      - name: Run the finished AppImage headlessly
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Tide-x86_64.AppImage --verify-update-files 2>&1 | tee probe.txt || true
          grep -q 'Expected signed manifest and installer paths' probe.txt
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: Tide-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error
