[workspace]
resolver = "2"
members = ["crates/core", "crates/playback", "crates/windows", "crates/provider", "crates/app"]
exclude = ["experiments/jam"]

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT"

# Generated UI code makes full debug information and incremental snapshots large.
# Keep routine contributor builds lean; release packaging is unchanged.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
